[package]
name = "rust_pyo3_demo"
version = "0.1.0"
edition = "2021"
description = "Biblioteca Rust exposta ao Python via PyO3"

[lib]
name = "rust_pyo3_demo"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
